name: Verify HATailAPK modules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test core and build selector library
        run: gradle --no-daemon :connection-core:test :selector-ui:assembleDebug :selector-ui:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: selector-library-and-test-results
          path: |
            selector-ui/build/outputs/aar/*-debug.aar
            connection-core/build/reports/tests/test/
  upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned source revisions
        run: python3 tools/upstreams.py verify
